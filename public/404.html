<!doctype html>
<html lang="it" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <title>Pagina non trovata — Maurizio Minieri</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#eb6131" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #09090b;
        color: #f4f4f5;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      .card {
        max-width: 420px;
        padding: 32px 24px;
        border-radius: 16px;
        border: 1px solid #27272a;
        background: #121216;
      }
      .code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 13px;
        color: #eb6131;
        letter-spacing: 0.08em;
      }
      h1 {
        margin: 12px 0 8px;
        font-size: 24px;
        font-weight: 600;
      }
      p {
        margin: 0 0 24px;
        font-size: 14px;
        line-height: 1.6;
        color: #a1a1aa;
      }
      a {
        display: inline-block;
        padding: 12px 20px;
        border-radius: 8px;
        background: #eb6131;
        color: #ffffff;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
      }
      a:hover {
        background: #d85325;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="code">ERRORE 404</div>
      <h1>Pagina non trovata</h1>
      <p>
        La risorsa richiesta non esiste o è stata spostata. Torna alla pagina principale di
        Maurizio Minieri.
      </p>
      <a href="/">Torna alla Home</a>
    </main>
  </body>
</html>
