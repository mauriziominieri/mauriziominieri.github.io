<!doctype html>
<html lang="it" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>Pagina non trovata — Maurizio Minieri</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#eb6131" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Outfit:wght@600&family=Plus+Jakarta+Sans:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --brand-accent: #eb6131;
        --brand-accent-hover: color-mix(in srgb, var(--brand-accent) 80%, #000000);
        --brand-accent-soft: color-mix(in srgb, var(--brand-accent) 68%, #ffffff);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: #09090b;
        color: #f4f4f5;
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        text-align: center;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        width: 100%;
        max-width: 440px;
        padding: 32px 24px;
        border-radius: 16px;
        border: 1px solid #27272a;
        background: #121216;
      }
      .logo {
        display: block;
        height: 36px;
        width: auto;
        margin: 0 auto 18px;
      }
      .code {
        font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        font-weight: 500;
        color: var(--brand-accent);
        letter-spacing: 0.08em;
      }
      h1 {
        margin: 10px 0 10px;
        font-family: 'Outfit', sans-serif;
        font-size: 26px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 24px;
        font-size: 14px;
        line-height: 1.65;
        color: #a1a1aa;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 10px 20px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        transition: background-color 150ms ease, border-color 150ms ease, color 150ms ease;
      }
      .btn:focus-visible {
        outline: 2px solid var(--brand-accent);
        outline-offset: 2px;
      }
      .btn-primary {
        background: var(--brand-accent);
        color: #ffffff;
      }
      .btn-primary:hover {
        background: var(--brand-accent-hover);
      }
      .btn-secondary {
        border: 1px solid #27272a;
        background: #09090b;
        color: #e4e4e7;
      }
      .btn-secondary:hover {
        border-color: #3f3f46;
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/images/logo-fox.svg" alt="Logo Maurizio Minieri" class="logo" />
      <div class="code">ERRORE 404</div>
      <h1>Pagina non trovata</h1>
      <p>
        La risorsa richiesta non esiste o è stata spostata. Torna alla pagina principale di
        Maurizio Minieri oppure vai direttamente ai contatti.
      </p>
      <div class="actions">
        <a href="/" class="btn btn-primary">Torna alla Home</a>
        <a href="/#contatti" class="btn btn-secondary">Contatti</a>
      </div>
    </main>
  </body>
</html>
